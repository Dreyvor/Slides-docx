[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "presentation-transcript-docx"
version = "0.4.0"
description = "Create slide-aligned DOCX transcripts from presentation videos and WebVTT files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "platformdirs>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
desktop-build = [
    "PySide6>=6.8,<7",
    "Nuitka>=2.6",
    "ordered-set>=4.1",
    "patchelf>=0.17; sys_platform == 'linux'",
    "zstandard>=0.23",
]

[project.scripts]
slides-docx = "slides_docx.cli:main"
slides-docx-gui = "slides_docx.gui:main"

[tool.setuptools.packages.find]
include = ["slides_docx*"]

[tool.setuptools.package-data]
"slides_docx.gui" = ["*.svg"]
