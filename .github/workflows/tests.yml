name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install .
      - run: python -m unittest tests.test_unit
      - run: slides-docx --help
      - run: python -m slides_docx --help
      - run: slides-docx completion bash
      - run: slides-docx completion zsh
      - run: slides-docx completion fish
      - run: slides-docx completion powershell
      - name: Validate PowerShell completion
        if: runner.os == 'Windows'
        shell: pwsh
        run: slides-docx completion powershell | Out-String | Invoke-Expression

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - run: python -m unittest tests.test_integration

  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install '.[gui]'
      - run: python -m unittest tests.test_gui
      - run: slides-docx-gui --version
